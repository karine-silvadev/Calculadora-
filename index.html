<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora">

    <input type="text" id="visor" readonly>
    <div class="botoes">
        <button id="limpar">C</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>&divide;</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>&times;</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>-</button>
        <button>0</button>
        <button>.</button>
        <button id="igual">=</button>
        <button>+</button>
      </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
